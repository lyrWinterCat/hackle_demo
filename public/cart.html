<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 - Hackle Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span>🛍</span>
        <span>Hackle Store</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="list.html">상품</a></li>
        <li><a href="cart.html" class="active">장바구니 <span class="cart-badge" id="cart-count">0</span></a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div style="background: white; padding: 2rem; border-radius: 16px; margin-bottom: 2rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
      <h1 style="margin: 0 0 0.5rem 0;">🛒 장바구니</h1>
      <p class="small">선택하신 상품을 확인하세요</p>
    </div>

    <div id="cart-list"></div>

    <div class="summary-box fade-in" id="summary-box" style="display: none;">
      <div class="row">
        <div>
          <div class="total-label">총 결제 금액</div>
          <div class="total-amount" id="total"></div>
        </div>
        <div class="row" style="gap: 1rem;">
          <button class="secondary" onclick="continueShopping()" style="background: rgba(255,255,255,0.2); color: white; border: 2px solid white;">
            계속 쇼핑하기
          </button>
          <button onclick="goCheckout()" style="background: white; color: var(--primary-color);">
            주문하기 →
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/tracking.js"></script>

  <script>
    const productIcons = {
      'notebook1': '💻',
      'notebook2': '💻',
      'desktop1': '🖥️',
      'smartphone1': '📱',
      'smartphone2': '📱',
      'earphone1': '🎧',
      'desk1': '🪑',
      'chair1': '🪑'
    };

    function render() {
      const cart = getCart();
      const container = document.getElementById("cart-list");
      const summaryBox = document.getElementById("summary-box");
      container.innerHTML = "";

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="card">
            <div class="empty-state">
              <div class="empty-state-icon">🛒</div>
              <h3>장바구니가 비어 있습니다</h3>
              <p class="small">원하시는 상품을 담아보세요!</p>
              <button onclick="continueShopping()">쇼핑 계속하기</button>
            </div>
          </div>
        `;
        summaryBox.style.display = "none";
        trackViewCart(cart);
        return;
      }

      cart.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "card fade-in";
        div.style.animationDelay = `${idx * 0.1}s`;
        
        const icon = productIcons[item.productId] || '📦';
        const categoryBadge = item.category === 'electronics' ? 'badge-electronics' : 'badge-furniture';

        div.innerHTML = `
          <div class="row" style="align-items: flex-start;">
            <div style="flex: 1;">
              <div class="product-image" style="height: 120px; font-size: 3rem; margin-bottom: 1rem;">
                <span>${icon}</span>
              </div>
            </div>
            <div style="flex: 2;">
              <div class="card-header">
                <h3 style="margin:0">${item.name}</h3>
                <span class="badge ${categoryBadge}">${item.category === 'electronics' ? '전자' : '가구'}</span>
              </div>
              <div class="small" style="margin-bottom: 0.5rem;">상품코드: ${item.productId}</div>
              <div class="price price-small">${item.price.toLocaleString()}원</div>
              
              <div class="row" style="margin-top: 1rem; gap: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <label class="small" style="font-weight: 600;">수량:</label>
                  <input type="number" min="1" value="${item.quantity}"
                         onchange="changeQty('${item.productId}', this.value)" />
                </div>
                <button class="danger" onclick="removeItem('${item.productId}')">
                  🗑️ 삭제
                </button>
              </div>
            </div>
            <div style="text-align: right;">
              <div class="small">소계</div>
              <div class="price price-small">${(item.price * item.quantity).toLocaleString()}원</div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });

      const totalAmount = cartTotalAmount(cart);
      document.getElementById("total").innerText = totalAmount.toLocaleString() + "원";
      summaryBox.style.display = "block";

      trackViewCart(cart);
      updateCartCount();
    }

    function changeQty(productId, qty) {
      const cartAfter = updateQuantity(productId, qty);
      const item = cartAfter.find(i => i.productId === productId);
      trackUpdateCartQuantity(productId, item ? item.quantity : 1, cartAfter);
      render();
    }

    function removeItem(productId) {
      if (confirm('이 상품을 장바구니에서 삭제하시겠습니까?')) {
        const cartAfter = removeFromCart(productId);
        trackRemoveFromCart(productId, cartAfter);
        render();
      }
    }

    function continueShopping() {
      const cart = getCart();
      trackContinueShopping(cart);
      window.location.href = "list.html";
    }

    function goCheckout() {
      const cart = getCart();
      if (cart.length === 0) return;
      trackEnterCheckout(cart);
      window.location.href = "checkout.html";
    }

    function updateCartCount() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = count;
    }

    render();
  </script>
</body>
</html>
