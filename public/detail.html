<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 - Hackle Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span>🛍</span>
        <span>Hackle Store</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="list.html">상품</a></li>
        <li><a href="cart.html">장바구니 <span class="cart-badge" id="cart-count">0</span></a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div style="margin-bottom: 1rem;">
      <button class="secondary" onclick="goBack()">← 목록으로</button>
    </div>
    <div id="detail"></div>
  </div>

  <script src="data/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/tracking.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const product = PRODUCTS.find(p => p.id === productId);

    const el = document.getElementById("detail");

    const productIcons = {
      'notebook1': '💻',
      'notebook2': '💻',
      'desktop1': '🖥️',
      'smartphone1': '📱',
      'smartphone2': '📱',
      'earphone1': '🎧',
      'desk1': '📦',
      'chair1': '🪑'
    };

    if (!product) {
      el.innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="empty-state-icon">😕</div>
            <h3>상품을 찾을 수 없습니다</h3>
            <p class="small">요청하신 상품이 존재하지 않습니다.</p>
            <button onclick="goBack()">목록으로 돌아가기</button>
          </div>
        </div>
      `;
    } else {
      const icon = productIcons[product.id] || '📦';
      const stockClass = product.stock < 5 ? 'low-stock' : '';
      const categoryBadge = product.category === 'electronics' ? 'badge-electronics' : 'badge-furniture';

      el.innerHTML = `
        <div class="card fade-in" style="max-width: 800px; margin: 0 auto;">
          <div class="product-image" style="height: 300px; font-size: 8rem;">
            <span>${icon}</span>
          </div>

          <div class="card-header" style="margin-top: 1.5rem;">
            <h1 style="margin: 0;">${product.name}</h1>
            <span class="badge ${categoryBadge}">${product.category === 'electronics' ? '전자제품' : '가구'}</span>
          </div>

          ${product.description ? `
            <div style="margin: 1.5rem 0; padding: 1rem; background: var(--gray-50); border-radius: 12px;">
              <p style="margin: 0; line-height: 1.6;">${product.description}</p>
            </div>
          ` : ''}

          ${product.specs ? `
            <div style="margin: 1rem 0;">
              <div class="small" style="font-weight: 600; margin-bottom: 0.5rem;">📋 주요 사양</div>
              <div style="padding: 0.75rem; background: var(--gray-100); border-radius: 8px;">
                <span style="font-size: 0.875rem;">${product.specs}</span>
              </div>
            </div>
          ` : ''}

          <div style="margin: 1.5rem 0;">
            <p class="price" style="font-size: 2rem;">${product.price.toLocaleString()}원</p>
            <div class="stock-badge ${stockClass}" style="display: inline-flex;">
              📦 재고: ${product.stock}개
            </div>
          </div>

          <div style="border-top: 2px solid var(--gray-100); padding-top: 1.5rem; margin-top: 1.5rem;">
            <div style="margin-bottom: 1.5rem;">
              <label class="small" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">수량 선택</label>
              <input id="qty" type="number" min="1" max="${product.stock}" value="1" />
            </div>

            <div class="row" style="gap: 1rem;">
              <button onclick="addItem()" class="success" style="flex: 2;">
                🛒 장바구니 담기
              </button>
              <a href="cart.html" style="flex: 1;">
                <button class="secondary" style="width: 100%;">장바구니 보기</button>
              </a>
            </div>
          </div>
        </div>
      `;

      trackViewDetail(product);
    }

    function addItem() {
      const qtyInput = document.getElementById("qty");
      const qty = Math.max(1, Math.min(product.stock, parseInt(qtyInput.value || "1", 10)));
      const cartAfter = addToCart(product, qty);
      trackAddToCart(product, qty, cartAfter);
      window.location.href = "cart.html";
    }

    function goBack() {
      window.location.href = "list.html";
    }

    function updateCartCount() {
      const cart = getCart();
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').textContent = count;
    }

    updateCartCount();
  </script>
</body>
</html>
