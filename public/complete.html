<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구매 완료 - Hackle Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <span>🛍</span>
        <span>Hackle Store</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="list.html">상품</a></li>
        <li><a href="cart.html">장바구니 <span class="cart-badge">0</span></a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <!-- Progress Steps -->
    <div style="background: white; padding: 1.5rem; border-radius: 16px; margin-bottom: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
      <div style="display: flex; justify-content: space-around; align-items: center;">
        <div style="text-align: center; opacity: 0.5;">
          <div style="font-size: 2rem;">🛒</div>
          <div class="small">장바구니</div>
        </div>
        <div style="flex: 1; height: 2px; background: var(--secondary-color); margin: 0 1rem;"></div>
        <div style="text-align: center; opacity: 0.5;">
          <div style="font-size: 2rem;">📋</div>
          <div class="small">주문서</div>
        </div>
        <div style="flex: 1; height: 2px; background: var(--secondary-color); margin: 0 1rem;"></div>
        <div style="text-align: center;">
          <div style="font-size: 2rem;">✅</div>
          <div class="small" style="font-weight: 700; color: var(--secondary-color);">완료</div>
        </div>
      </div>
    </div>

    <div class="card fade-in" style="max-width: 600px; margin: 0 auto;">
      <div class="success-message">
        <div class="success-icon">✅</div>
        <h1 style="margin: 0 0 1rem 0; color: var(--secondary-color);">주문이 완료되었습니다!</h1>
        <p class="text-muted" style="font-size: 1.125rem; margin-bottom: 2rem;">
          주문하신 상품은 빠르게 배송될 예정입니다.
        </p>
        
        <div style="background: var(--gray-50); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
          <div class="row" style="justify-content: center; gap: 2rem;">
            <div style="text-align: center;">
              <div class="small">주문번호</div>
              <div style="font-weight: 700; font-size: 1.125rem;" id="order-number">-</div>
            </div>
            <div style="text-align: center;">
              <div class="small">주문일시</div>
              <div style="font-weight: 700; font-size: 1.125rem;" id="order-date">-</div>
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
          <a href="index.html">
            <button class="lg success">🏠 홈으로</button>
          </a>
          <a href="list.html">
            <button class="lg secondary">계속 쇼핑하기</button>
          </a>
        </div>
      </div>
    </div>

    <!-- Thank You Message -->
    <div style="text-align: center; margin-top: 3rem; padding: 2rem; opacity: 0.7;">
      <p style="font-size: 1.25rem; margin-bottom: 0.5rem;">🎉</p>
      <p class="text-muted">Hackle Store를 이용해 주셔서 감사합니다!</p>
    </div>
  </div>

  <script src="js/tracking.js"></script>
  <script>
    // Generate order number
    const orderNumber = 'ORD' + Date.now().toString().slice(-8);
    const orderDate = new Date().toLocaleString('ko-KR', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });

    document.getElementById('order-number').textContent = orderNumber;
    document.getElementById('order-date').textContent = orderDate;
  </script>
</body>
</html>
